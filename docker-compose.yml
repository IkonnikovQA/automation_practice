services:
  selenium:
    image: selenium/standalone-chrome:4.27.0
    shm_size: "2gb"
    ports:
      - "4444:4444"
      - "7900:7900"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4444/wd/hub/status | grep -q '\"ready\": true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  api-smoke:
    build: .
    profiles: ["api"]
    command: ["mvn", "-pl", "api-tests", "-am", "-Psmoke-api", "-Dtest=AuthApiTest,BookingApiTest", "test"]

  ui-smoke:
    build: .
    profiles: ["ui"]
    depends_on:
      selenium:
        condition: service_healthy
    environment:
      UI_REMOTE_URL: http://selenium:4444/wd/hub
      UI_HEADLESS: "false"
      UI_BROWSER: chrome
    command: ["mvn", "-pl", "ui-tests", "-am", "-Psmoke-ui", "-Dtest=SauceDemoUiTest", "test"]
