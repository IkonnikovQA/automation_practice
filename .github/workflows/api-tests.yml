name: API and UI Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Spotless format check
        run: mvn -B spotless:check

      - name: Checkstyle
        run: mvn -B checkstyle:check

  api-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Prepare Allure metadata
        run: |
          mkdir -p api-tests/target/allure-results
          cat > api-tests/target/allure-results/environment.properties <<EOF
          run.type=api-smoke
          git.branch=${{ github.ref_name }}
          git.sha=${{ github.sha }}
          workflow=${{ github.workflow }}
          run.id=${{ github.run_id }}
          run.attempt=${{ github.run_attempt }}
          actor=${{ github.actor }}
          api.baseUrl=https://restful-booker.herokuapp.com
          EOF

      - name: Run smoke API tests
        run: mvn -B -pl api-tests -am clean test -Psmoke-api

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-api-smoke
          path: api-tests/target/surefire-reports/**

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api-smoke
          path: api-tests/target/allure-results/**

  ui-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: quality
    services:
      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        options: >-
          --shm-size=2g
          --health-cmd="wget -qO- http://localhost:4444/wd/hub/status | grep -q '\"ready\": true'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Prepare Allure metadata
        run: |
          mkdir -p ui-tests/target/allure-results
          cat > ui-tests/target/allure-results/environment.properties <<EOF
          run.type=ui-smoke
          git.branch=${{ github.ref_name }}
          git.sha=${{ github.sha }}
          workflow=${{ github.workflow }}
          run.id=${{ github.run_id }}
          run.attempt=${{ github.run_attempt }}
          actor=${{ github.actor }}
          ui.baseUrl=https://www.saucedemo.com
          ui.browser=chrome
          ui.remote.url=http://localhost:4444/wd/hub
          EOF

      - name: Run smoke UI tests
        run: mvn -B -pl ui-tests -am clean test -Psmoke-ui -Dui.remote.url=http://localhost:4444/wd/hub -Dui.headless=false

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-ui-smoke
          path: ui-tests/target/surefire-reports/**

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-smoke
          path: ui-tests/target/allure-results/**

  ui-smoke-diagnostics:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true
    services:
      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        options: >-
          --shm-size=2g
          --health-cmd="wget -qO- http://localhost:4444/wd/hub/status | grep -q '\"ready\": true'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Prepare Allure metadata
        run: |
          mkdir -p ui-tests/target/allure-results
          cat > ui-tests/target/allure-results/environment.properties <<EOF
          run.type=ui-smoke-diagnostics
          git.branch=${{ github.ref_name }}
          git.sha=${{ github.sha }}
          workflow=${{ github.workflow }}
          run.id=${{ github.run_id }}
          run.attempt=${{ github.run_attempt }}
          actor=${{ github.actor }}
          ui.baseUrl=https://www.saucedemo.com
          ui.browser=chrome
          ui.remote.url=http://localhost:4444/wd/hub
          rerun.failures=1
          EOF

      - name: Run UI diagnostics with single rerun
        run: mvn -B -pl ui-tests -am clean test -Psmoke-ui -Dui.remote.url=http://localhost:4444/wd/hub -Dui.headless=false -Dsurefire.rerunFailingTestsCount=1

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-ui-diagnostics
          path: ui-tests/target/surefire-reports/**

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-diagnostics
          path: ui-tests/target/allure-results/**

  regression:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Prepare Allure metadata
        run: |
          mkdir -p api-tests/target/allure-results ui-tests/target/allure-results
          cat > api-tests/target/allure-results/environment.properties <<EOF
          run.type=regression
          git.branch=${{ github.ref_name }}
          git.sha=${{ github.sha }}
          workflow=${{ github.workflow }}
          run.id=${{ github.run_id }}
          run.attempt=${{ github.run_attempt }}
          actor=${{ github.actor }}
          suite=full
          EOF
          cp api-tests/target/allure-results/environment.properties ui-tests/target/allure-results/environment.properties

      - name: Run full regression suite
        run: mvn -B clean test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-regression
          path: |
            api-tests/target/surefire-reports/**
            ui-tests/target/surefire-reports/**

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression-api
          path: api-tests/target/allure-results/**

      - name: Upload Allure UI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression-ui
          path: ui-tests/target/allure-results/**

  allure-report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: regression
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download API Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-regression-api
          path: merged-allure-results

      - name: Download UI Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-regression-ui
          path: merged-allure-results

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: merged-allure-results
          allure_report: allure-report

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
